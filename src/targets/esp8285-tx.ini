[env_common_8285tx]
extends = env_common_esp82xx
monitor_speed = 460800
build_flags =
	${env_common_esp82xx.build_flags}
	${common_env_data.build_flags_tx}
	-include target/Unified_ESP8285_TX.h
build_src_filter =
	${common_env_data.build_src_filter} -<rx_*.cpp> -<rx-*/>

[env:Unified_ESP8285_2400_TX_via_UART]
extends = env_common_8285tx, radio_SX128X
build_flags =
	${env_common_8285tx.build_flags}
	${radio_SX128X.build_flags}

[env:Unified_ESP8285_2400_TX_via_WIFI]
extends = env:Unified_ESP8285_2400_TX_via_UART

[env:Unified_ESP8285_900_TX_via_UART]
extends = env_common_8285tx, radio_SX127X
build_flags =
	${env_common_8285tx.build_flags}
	${radio_SX127X.build_flags}

[env:Unified_ESP8285_900_TX_via_WIFI]
extends = env:Unified_ESP8285_900_TX_via_UART

[env:HappyModel_ES900RX_as_TX_Bridge]
extends = env_common_8285tx, radio_SX127X
board_config = happymodel.rx_900.es900
monitor_speed = 460800
build_src_filter = ${eml_bridge.build_src_filter}
lib_deps = ${eml_bridge.lib_deps_esp8285}
build_flags =
	${env_common_8285tx.build_flags}
	${radio_SX127X.build_flags}
	-DRegulatory_Domain_FCC_915
	-DUSE_AIRPORT_AT_BAUD=460800
	-DEML_BRIDGE
	-DSX127X_FSK_SUPPORT
	-DEML_SX1276_20DBM
